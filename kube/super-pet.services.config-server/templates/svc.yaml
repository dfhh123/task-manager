apiVersion: v1
kind: Service
metadata:
  name: {{ include "super-pet.services.config-server.fullname" . }}
  labels:
    {{- include "super-pet.services.config-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
  selector:
    {{- include "super-pet.services.config-server.selectorLabels" . | nindent 4 }}
