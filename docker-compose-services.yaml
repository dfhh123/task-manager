services:
  super-pet-services-user-service:
    image: super-pet.services.user-service:latest
    build:
      context: services/user-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped
    ports:
      - "8083:8080"
    networks:
      application-network:
        aliases:
          - user-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  application-network:
    driver: bridge