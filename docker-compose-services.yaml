services:
  super-pet-services-user-service:
    image: super-pet.services.user-service:latest
    build:
      context: services/user-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005
    restart: no
    ports:
      - "8083:8080"
      - "5005:5005"
    networks:
      application-network:
        aliases:
          - user-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  application-network:
    driver: bridge